<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conference 1x1s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#17213A; --ink-2:#55627A; --ink-3:#8A94A8;
  --rule:#D6DCE6; --rule-2:#E7EBF1; --grid:#EEF1F5; --accent:#17213A; --accent-ink:#FFFFFF;
  --now:#D23B3B; --warn-bg:#FFF4D6; --warn-ink:#6B4E00; --focus:#2F6FED;
  --s1:#1E6F8E; --s2:#B8651B; --s3:#6B4C9A; --s4:#2E7D4F; --s5:#A33A5E; --s6:#5B6B2E; --s0:#9AA3B5;
  --shadow:0 12px 32px rgba(23,33,58,.14);
  --label-w:184px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#E7EBF3; --ink-2:#A9B3C6; --ink-3:#6F7A91;
    --rule:#2E3850; --rule-2:#273047; --grid:#1F2737; --accent:#E7EBF3; --accent-ink:#121722;
    --now:#FF6B6B; --warn-bg:#3A2F10; --warn-ink:#F3D27A; --focus:#7FA8FF;
    --s1:#4FA3C7; --s2:#E0924A; --s3:#A98BD6; --s4:#5FB381; --s5:#D86E92; --s6:#9BB05A; --s0:#6F7A91;
    --shadow:0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121722; --surface:#1A2130; --surface-2:#222B3C; --ink:#E7EBF3; --ink-2:#A9B3C6; --ink-3:#6F7A91;
  --rule:#2E3850; --rule-2:#273047; --grid:#1F2737; --accent:#E7EBF3; --accent-ink:#121722;
  --now:#FF6B6B; --warn-bg:#3A2F10; --warn-ink:#F3D27A; --focus:#7FA8FF;
  --s1:#4FA3C7; --s2:#E0924A; --s3:#A98BD6; --s4:#5FB381; --s5:#D86E92; --s6:#9BB05A; --s0:#6F7A91;
  --shadow:0 12px 32px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; font-variant-numeric:tabular-nums;
  display:flex; flex-direction:column;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:9; background:var(--surface);
  border-bottom:1px solid var(--rule); padding:10px 16px 0;
}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
h1 small{font-weight:400;color:var(--ink-2);margin-left:8px;font-size:14px}
.days{display:flex;gap:2px;margin-top:6px}
.days button{
  background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 10px;font-size:15px;color:var(--ink-2);
}
.days button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:200px}
.chip{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);
  border-radius:999px;padding:5px 11px 5px 8px;font-size:14px;color:var(--ink-2)
}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink-3))}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface-2);font-weight:500}
.search{flex:0 1 220px;min-width:140px;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:6px 12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:500}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:500;white-space:nowrap}
.primary[disabled]{opacity:.5;cursor:default}
.ghost{background:none;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;color:var(--ink)}
.banner{padding:8px 16px;font-size:14px;background:var(--warn-bg);color:var(--warn-ink)}
.banner b{font-weight:600}
.note{padding:8px 16px;font-size:13px;color:var(--ink-2)}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

/* ---------- timeline ---------- */
.tl{position:relative;overflow:auto;flex:1 1 auto;background:var(--surface);border-bottom:1px solid var(--rule)}
.tl-inner{position:relative;display:grid;grid-template-columns:var(--label-w) 1fr;min-width:max-content;align-items:start}
.tl-head{display:contents}
.tl-head .corner{position:sticky;left:0;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);height:34px}
.tl-head .axis{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--rule);height:34px}
.axis span{position:absolute;top:8px;margin-left:6px;font-size:13px;color:var(--ink-2)}
.row{display:contents}
.row .label{
  position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule-2);
  padding:4px 12px;font-weight:500;font-size:14px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;gap:2px;width:var(--label-w);overflow:hidden
}
.row .label span,.row .label small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .label small{font-weight:400;color:var(--ink-3);font-size:12px}
.row .lanes{position:relative;border-bottom:1px solid var(--rule-2);
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:var(--hour-w) 100%;
}
.bar{
  position:absolute;height:calc(var(--lane-h) - 6px);top:3px;border-radius:5px;background:var(--c,var(--s0));color:#fff;
  padding:4px 8px;font-size:13px;line-height:1.3;overflow:hidden;border:0;text-align:left;display:flex;flex-direction:column;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.bar b,.bar .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar b{font-weight:600}
.bar .t{opacity:.85;font-size:12px}
.bar.multi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c2)}
.bar.unmapped{background:repeating-linear-gradient(135deg,var(--s0),var(--s0) 6px,#B9C0CE 6px,#B9C0CE 12px);color:var(--ink)}
.bar:hover{filter:brightness(1.08)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.dayhead{display:contents}
.dayhead .label{position:sticky;left:0;z-index:3;background:var(--surface-2);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0 12px;display:flex;align-items:center;font-weight:600;font-size:13px;color:var(--ink-2);width:var(--label-w)}
.dayhead .lanes{background:var(--surface-2);border-bottom:1px solid var(--rule);height:30px}
.listday{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.empty{padding:48px 16px;text-align:center;color:var(--ink-2)}
.empty h2{font-size:17px;font-weight:600;color:var(--ink);margin:0 0 6px}

/* ---------- list ---------- */
.list{padding:8px 16px 24px;background:var(--surface);flex:1 1 auto;overflow:auto}
.slot{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.slot .time{font-weight:600;font-size:14px;padding-top:9px}
.slot .time small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px}
.card:hover{background:var(--surface-2)}
.card .swatch{flex:0 0 5px;align-self:stretch;border-radius:3px;background:var(--c,var(--s0));margin-top:2px}
.card .who{font-weight:600}
.card .meta{color:var(--ink-2);font-size:14px}
.card .cov{color:var(--ink-3);font-size:13px}

/* ---------- detail sheet ---------- */
.sheet{position:fixed;z-index:20;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;
  right:0;top:env(safe-area-inset-top,0px);bottom:0;width:min(420px,100%);transform:translateX(100%);transition:transform .22s ease;}
.sheet[data-open="true"]{transform:none}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 10px;border-bottom:1px solid var(--rule)}
.sheet-head h2{margin:0;font-size:17px;line-height:1.3}
.sheet-head .x{background:none;border:0;font-size:22px;line-height:1;color:var(--ink-2);padding:0 2px}
.sheet-body{padding:12px 18px 20px;overflow:auto}
.sheet dl{margin:0;display:grid;grid-template-columns:136px 1fr;gap:10px 12px;font-size:14px}
.sheet dt{color:var(--ink-3)}
.sheet dd{margin:0;overflow-wrap:anywhere}
.sheet dd.strong{font-weight:600;color:var(--ink)}
.sheet a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.sheet .call{margin-top:16px;padding:12px 14px;border-left:3px solid var(--now);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(10,14,24,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}

/* ---------- admin ---------- */
.admin{border-top:1px solid var(--rule);background:var(--bg);padding:14px 16px 20px}
.admin summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
.admin .drop{margin-top:10px;border:1.5px dashed var(--rule);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2);background:var(--surface)}
.admin .drop.over{border-color:var(--focus);color:var(--ink)}
.admin input[type=file]{display:none}
.admin .report{margin-top:10px;font-size:13px;white-space:pre-wrap;color:var(--ink-2);max-height:220px;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
.admin .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.histhead{font-size:14px;font-weight:600;color:var(--ink-2);margin:18px 0 6px}
.ver{border:1px solid var(--rule);border-radius:8px;background:var(--surface);margin-bottom:6px}
.ver summary{display:flex;gap:10px;align-items:baseline;padding:8px 12px;cursor:pointer;font-size:14px;list-style:none}
.ver summary::-webkit-details-marker{display:none}
.ver .when{color:var(--ink-3);white-space:nowrap;font-size:13px;min-width:140px}
.ver .sum{flex:1}
.ver .tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.ver.cur summary .sum{font-weight:500}
.verbody{padding:0 12px 10px;border-top:1px solid var(--rule-2)}
.verbody pre{margin:8px 0 0;white-space:pre-wrap;font:13px/1.45 "IBM Plex Sans",sans-serif;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  :root{--label-w:118px}
  h1 small{display:none}
  .controls{padding:8px 12px}
  .search{flex-basis:100%}
  .sheet{top:auto;left:0;right:0;bottom:0;width:100%;max-height:86%;border-radius:14px 14px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom,0px)}
  .slot{grid-template-columns:70px 1fr;gap:6px}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Conference meetings</h1>
    <nav class="days" id="days" aria-label="Day"></nav>
  </div>
</header>
<div class="controls">
  <div class="chips" id="chips" role="group" aria-label="Salesperson"></div>
  <input class="search" id="q" type="search" placeholder="Client or company" aria-label="Search client or company">
  <div class="seg" role="group" aria-label="View">
    <button id="vTimeline" aria-pressed="true">Timeline</button>
    <button id="vList" aria-pressed="false">List</button>
  </div>
  <button class="primary" id="addCal" hidden>Add to Outlook</button>
</div>
<div id="banner" hidden></div>
<main id="main"></main>
<details class="admin" id="admin" hidden>
  <summary>Update the schedule</summary>
  <div class="row2" style="margin-top:8px">
    <button class="ghost" id="exportXlsx">Download the current schedule in Excel</button>

  </div>
  <div class="drop" id="drop">
    Drop the edited spreadsheet here, or <label style="text-decoration:underline;cursor:pointer">choose a file<input type="file" id="file" accept=".xlsx,.xlsm,.xls"></label>.
  </div>
  <div class="report" id="report" hidden></div>
  <div class="row2">
    <button class="primary" id="publish" disabled>Publish to everyone</button>
    <span id="pubnote" style="font-size:13px;color:var(--ink-2)"></span>
  </div>
  <h3 class="histhead">History</h3>
  <div id="history"></div>
</details>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" data-open="false" aria-hidden="true">
  <div class="sheet-head">
    <div><h2 id="shTitle"></h2><div id="shSub" style="color:var(--ink-2);font-size:14px;margin-top:3px"></div></div>
    <button class="x" id="shClose" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="shBody"></div>
</aside>

<script>
/* =========================== pure logic (shared with tests) =========================== */
const ALIASES = {
  date:["date","meeting date","day"],
  start:["start time","start","time","begin","from"],
  end:["end time","end","finish","to"],
  room:["room","location","rm","table"],
  company:["company","issuer","corporate","presenting company","management","mgmt"],
  ticker:["ticker","symbol"],
  companyAtt:["company attendees","mgmt attendees","management attendees","corporate attendees"],
  client:["client firm","client","firm","investor","investor firm","account","fund"],
  clientAtt:["client attendee(s)","client attendees","client attendee","attendee","attendees","investor attendees","investor attendee","contact","name"],
  clientEmail:["client email(s)","client email","client emails","email","emails","attendee email"],
  clientPhone:["client phone","phone","mobile","cell","attendee phone"],
  analyst:["cantor analyst (covers company)","cantor analyst","analyst","research analyst"],
  notes:["notes","note","comments","comment"],
  sales:["salesperson","sales","sales coverage","coverage","sales rep","rep"],
  salesEmail:["salesperson email","sales email","email"],
  salesMobile:["salesperson mobile","sales mobile","mobile","phone"],
  aliases:["also known as","aka","aliases","alias","other names"],
  role:["title / pod","title/pod","title","pod","role"],
};
const norm = s => String(s ?? "").trim().toLowerCase().replace(/[\s_]+/g," ");
const normKey = s => norm(s).replace(/[^a-z0-9 ]/g,"").replace(/\b(llc|lp|inc|ltd|llp|co|corp|plc)\b/g,"").replace(/\s+/g," ").trim();
const pad2 = n => String(n).padStart(2,"0");

function mapHeaders(row){
  const hs = row.map(norm), found = {};
  for (const [field,names] of Object.entries(ALIASES)){
    for (const n of names){ const i = hs.indexOf(n); if (i>=0 && !Object.values(found).includes(i)){ found[field]=i; break; } }
  }
  return found;
}
function readTable(rows){
  const hi = rows.findIndex(r => r && r.some(c => c!==null && c!==undefined && c!==""));
  if (hi<0) return {cols:{},data:[],first:1};
  const cols = mapHeaders(rows[hi]); const data=[];
  for (let i=hi+1;i<rows.length;i++){
    const r = rows[i]; if (!r || !r.some(c => c!==null && c!==undefined && c!=="")) continue;
    const o={}; for (const [f,ci] of Object.entries(cols)) o[f]= r[ci] ?? null; o._row=i+1; data.push(o);
  }
  return {cols,data,first:hi+2};
}
function parseDate(v){
  if (v===null||v===undefined||v==="") return null;
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if (typeof v==="number" && typeof XLSX!=="undefined"){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${pad2(d.m)}-${pad2(d.d)}`:null; }
  const s=String(v).trim().replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+/i,"");
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/); if (m){ let y=m[3]?+m[3]:new Date().getFullYear(); if(y<100)y+=2000; return `${y}-${pad2(m[1])}-${pad2(m[2])}`; }
  const months=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  m=s.toLowerCase().match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?/); if (m && months.includes(m[1])) { const y=m[3]?+m[3]:new Date().getFullYear(); return `${y}-${pad2(months.indexOf(m[1])+1)}-${pad2(m[2])}`; }
  m=s.toLowerCase().match(/^(\d{1,2})[- ]([a-z]{3})[a-z]*[- ](\d{2,4})/); if (m && months.includes(m[2])) { let y=+m[3]; if(y<100)y+=2000; return `${y}-${pad2(months.indexOf(m[2])+1)}-${pad2(m[1])}`; }
  const d=new Date(s); return isNaN(d)?null:`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function parseTime(v){
  if (v===null||v===undefined||v==="") return null;
  if (v instanceof Date && !isNaN(v)) return `${pad2(v.getHours())}:${pad2(v.getMinutes())}`;
  if (typeof v==="number"){ const secs=Math.round(((v%1)+1)%1*86400); return `${pad2(Math.floor(secs/3600))}:${pad2(Math.floor(secs%3600/60))}`; }
  let s=String(v).trim().toLowerCase().split(/\s*[-–—]\s*|\s+to\s+/)[0].replace(/[.\s]/g,"");
  const m=s.match(/^(\d{1,2})(?::?(\d{2}))?(am|pm)?$/); if(!m) return null;
  let h=+m[1], mi=+(m[2]||0); const ap=m[3];
  if (ap==="pm"&&h!==12) h+=12; if (ap==="am"&&h===12) h=0; if (!ap&&h<7) h+=12;
  if (h>23||mi>59) return null; return `${pad2(h)}:${pad2(mi)}`;
}
const toMin = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const fromMin = n => `${pad2(Math.floor(n/60)%24)}:${pad2(n%60)}`;
function hashId(s){ let h1=0x811c9dc5,h2=0x01000193; for (let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=Math.imul(h2^c,2246822519)>>>0; } return h1.toString(16).padStart(8,"0")+h2.toString(16).padStart(8,"0"); }

const DEFAULT_CONF = {name:"Conference", tz:"America/New_York", defaultLen:40, startOff:0, endOff:0, fuLen:0, style:"two", title:""};
const pageTitle = conf => conf.title || (conf.name.replace(/\s*conference\s*/i," ").trim()+" Meetings");

/** Workbook (SheetJS) -> {conf, meetings, coverage, issues, warnings} */
function parseWorkbook(wb){
  const sheets={}; for (const n of wb.SheetNames) sheets[norm(n)]=n;
  const pick=(...names)=>{ for (const n of names) if (sheets[n]) return wb.Sheets[sheets[n]]; return null; };
  const wsM=pick("meetings","1x1s","1x1","schedule","meeting schedule"), wsC=pick("coverage","sales coverage","clients","client coverage"), wsS=pick("settings","config");

/** coverage key (firm or alias) -> rows; returns lookup(clientName) -> {rows, note} */
function coverageLookup(coverage){
  const map={};
  for (const c of coverage) for (const n of [c.client, ...(c.aliases||[])]){ const k=normKey(n); if (k) (map[k] ??= []).push(c); }
  const byAtt=att=>{ const txt=String(att||"").toLowerCase(); if(!txt.trim()) return {rows:[],firms:[]};
    const rows=coverage.filter(c=>c.contact && txt.includes(c.contact.toLowerCase())); return {rows, firms:[...new Set(rows.map(c=>c.client))]}; };
  return function(client, attendees){
    const mk=normKey(client);
    if (mk && map[mk]) return {rows:map[mk], note:null, firms:[map[mk][0].client]};
    const cands=mk?Object.keys(map).filter(k => mk.startsWith(k+" ") || k.startsWith(mk+" ") || (k.length>=6 && mk.includes(k))).sort((a,b)=>b.length-a.length):[];
    if (cands.length){
      const teams=new Set(cands.map(k => map[k].map(c=>c.sales).sort().join("|")));
      if (teams.size===1) return {rows:map[cands[0]], note:`“${client}” matched coverage entry “${cands[0]}”`, firms:[map[cands[0]][0].client]};
      return {rows:[], note:`“${client}” matches several coverage entries (${cands.join(", ")}) – add it to “Also known as” on the right row`, firms:[]};
    }
    const a=byAtt(attendees); const teams=new Set(a.rows.map(c=>c.sales));
    if (teams.size===1) return {rows:a.rows, note:`“${client||attendees}” matched via attendee (${a.firms.join(", ")})`, firms:a.firms};
    if (teams.size>1) return {rows:[], note:`attendees “${attendees}” map to several salespeople (${[...teams].join(", ")})`, firms:a.firms};
    return {rows:[], note:null, firms:[]};
  };
}
/** attach sales coverage + colors */
function joinCoverage(data){
  const people=[]; const idx={};
  for (const c of data.coverage){ if(!(c.sales in idx)){ idx[c.sales]=people.length; people.push({name:c.sales,email:c.email,mobile:c.mobile,color:`var(--s${(people.length%6)+1})`}); } }
  const L=coverageLookup(data.coverage);
  const byName={}; for (const p of people) byName[norm(p.name)]=p;
  const meetings=data.meetings.map(m=>{
    if (m.salesOverride){ let p=byName[norm(m.salesOverride)]; if(!p){ p={name:m.salesOverride,email:"",mobile:"",color:`var(--s${(people.length%6)+1})`}; people.push(p); byName[norm(p.name)]=p; } return {...m, sales:[p]}; }
    return {...m, sales: [...new Set(L(m.client, m.clientAtt).rows.map(c=>people[idx[c.sales]]))]};

}

function eventFields(kind,m,conf){

  const companyLong=m.company;
  const startD=zonedToUtc(m.date,m.start,conf.tz), endD=zonedToUtc(m.date,m.end,conf.tz), dur=toMin(m.end)-toMin(m.start);

  } else {
    s0=startD; e0=endD;

const trig = min => min>=0 ? `-PT${min}M` : `PT${-min}M`;
function buildIcs(meetings,conf,calName,styleOverride){

  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cantor//Conference Reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",`X-WR-CALNAME:${icsEsc(calName)}`];

/** plain-text lines for a diff; short=true gives a one-line summary */
function describeChanges(d,short){

  if (short){ const parts=[]; if(d.added.length)parts.push(`${d.added.length} added`); if(d.removed.length)parts.push(`${d.removed.length} removed`); if(d.moved.length)parts.push(`${d.moved.length} moved`); if(d.changed.length)parts.push(`${d.changed.length} edited`);

    const version={id, createdAt:new Date().toISOString(), summary, changes:describeChanges(diff), count:diff.count, meetings:d.meetings.length, data:snapshotOf(d)};
    await caps.db.doc("versions/"+id).set(version);
    await caps.db.doc("data/schedule").set({...snapshotOf(d), sample:false, versionId:id, updatedAt:version.createdAt});
    return version;
  }
  $("publish").onclick=async()=>{
    if (!state.pending||!caps.db) return;
    const d=state.pending; $("publish").disabled=true; $("pubnote").textContent="Publishing…";
    try { await publishSchedule(d); $("pubnote").textContent="Published."; toast("Published – everyone sees it now."); state.pending=null; loadHistory(); }
    catch(e){ $("pubnote").textContent="Publish failed: "+(e.message||e.code||e); $("publish").disabled=false; }
  };
  /* ----- history ----- */
  let histUnsub=null;
  function loadHistory(){
    if (!caps.db||histUnsub) return;
    histUnsub=caps.db.collection("versions").orderBy("createdAt","desc").limit(30).onSnapshot(snap=>{ state.versions=snap.docs.map(x=>x.data()); renderHistory(); }, ()=>{ histUnsub=null; });
  }
  function renderHistory(){
    const h=$("history"); const cur=state.live?.versionId;
    if (!state.versions.length){ h.innerHTML=`<div style="font-size:13px;color:var(--ink-3)">No uploads yet. Each upload you publish is listed here.</div>`; return; }
    h.innerHTML="";
    state.versions.forEach((v,i)=>{
      const det=document.createElement("details"); det.className="ver"+(v.id===cur?" cur":"");
      const when=new Date(v.createdAt).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
      det.innerHTML=`<summary><span class="when">${esc(when)}</span><span class="sum">${esc(v.summary)}</span>${v.id===cur?'<span class="tag">live</span>':""}</summary>
        <div class="verbody"><pre>${esc((v.changes||[]).join("\n")||"No changes recorded.")}</pre>
        <div class="row2">${v.id===cur?(i+1<state.versions.length?`<button class="ghost" data-undo="${esc(state.versions[i+1].id)}">Undo this change</button>`:""):`<button class="ghost" data-restore="${esc(v.id)}">Restore this version</button>`}</div></div>`;
      h.appendChild(det);
    });
    h.querySelectorAll("[data-restore],[data-undo]").forEach(b=>b.onclick=()=>restoreVersion(b.dataset.restore||b.dataset.undo, !!b.dataset.undo));
  }
  async function restoreVersion(id,isUndo){
    const v=state.versions.find(x=>x.id===id); if(!v||!caps.db) return;
    const when=new Date(v.createdAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    if (!confirm(`${isUndo?"Undo the latest change and go back":"Restore"} to the version from ${when}? Everyone will see it.`)) return;
    try { await publishSchedule({...v.data, issues:v.data.issues||[], warnings:v.data.warnings||[]}, isUndo?"Undo":`Restored ${when}`); toast(isUndo?"Undone.":"Restored."); }
    catch(e){ toast("Couldn’t restore: "+(e.message||e.code||e)); }
  }
  $("admin").addEventListener("toggle",()=>{ if($("admin").open) loadHistory(); });

  /* ----- misc ----- */
  function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  let toastT; function toast(msg){ let t=document.querySelector(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),6000); }

  /* ----- static hosting (GitHub Pages etc.): no claude runtime -> read schedule.xlsx that sits next to this page ----- */
  async function connectStatic(){
    caps.downloads={ save: async ({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".ics")?"text/calendar":"application/octet-stream"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},2000); return {status:"saved"}; } };
    if (location.protocol!=="file:") for (const name of ["schedule.xlsx","conference_1x1.xlsx"]){
      try { const r=await fetch(name+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok) continue;
        const data=parseWorkbook(XLSX.read(await r.arrayBuffer(),{type:"array",cellDates:true})); state.status="ready"; setData(data,{}); return; }
      catch(e){ /* try the next name */ }
    }
    state.status="static-empty"; renderView();
  }
  renderView();
  if (window.claude && typeof claude.use==="function") connect(); else connectStatic();
})();
</script>
